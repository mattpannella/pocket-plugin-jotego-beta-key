[package]
name = "jotego-beta-key"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Pocket Sync / pupdate plugin: fetches Jotego's jtbeta.zip (GitHub sponsor repo or Patreon) into Licenses/"
publish = false

[lib]
name = "plugin"
crate-type = ["cdylib", "rlib"]

[dependencies]
extism-pdk = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex-lite = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
